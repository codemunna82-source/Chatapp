# Builds a debug-signed VOXO APK on GitHub's own runners, which (unlike the
# sandbox this workflow was authored in) have real network access to
# dl.google.com / the Android SDK. Produces a downloadable artifact on every
# run — see BUILD.md for turning this into a genuinely release-signed build
# once a real keystore exists (as repo secrets, never committed).
name: Android APK build

on:
  workflow_dispatch:
  push:
    branches:
      - claude/voxo-android-whatsapp-txghqq
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    # Safeguard so a genuinely stuck run doesn't tie up a runner until
    # GitHub's own 6-hour default job timeout.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform/build-tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Assemble debug APK
        working-directory: mobile/android
        timeout-minutes: 15
        # Restricts the native (Reanimated/Gesture Handler/app) CMake/ninja
        # build to arm64-v8a only, instead of gradle.properties' default of
        # all 4 ABIs. A prior run's logs showed this was never actually
        # stuck — it was genuinely compiling native C++ for
        # armeabi-v7a/arm64-v8a/x86/x86_64 in sequence and simply ran out of
        # time. arm64-v8a alone covers virtually every real Android device;
        # this only narrows what CI builds for a debug smoke artifact, not
        # the app.config.ts / gradle.properties defaults everyone else uses.
        run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxo-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
