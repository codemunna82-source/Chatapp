# Builds a standalone VOXO APK on GitHub's own runners, which (unlike the
# sandbox this workflow was authored in) have real network access to
# dl.google.com / the Android SDK. Produces a downloadable artifact on every
# run — see BUILD.md for turning this into a genuinely release-signed build
# once a real keystore exists (as repo secrets, never committed).
#
# Builds the "release" *build type*, not "debug": a debug-type APK doesn't
# embed the JS bundle at all — it expects to fetch it live from a Metro dev
# server on your computer, which fails with "Unable to load script" the
# moment you just install and open it on a phone with no Metro running.
# Release-type embeds the JS bundle in the APK so it runs standalone. This
# is still signed with the debug key (android/app/build.gradle falls back
# to it when android/app/keystore.properties — a real keystore — doesn't
# exist), so it's an installable, standalone, but NOT production-signed
# APK. See BUILD.md for producing a genuinely production-signed release.
name: Android APK build

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend REST API base URL, reachable from the phone installing this APK. Defaults to the deployed Render backend (see DEPLOY.md) — override for a local backend on your PC's LAN IP instead, e.g. http://192.168.1.50:4000."
        required: false
        default: "https://chatapp-0orj.onrender.com"
      socket_url:
        description: "Socket.IO server URL — usually the same host as api_url."
        required: false
        default: "https://chatapp-0orj.onrender.com"
  # Deliberately manual-only: this workflow no longer auto-builds on push.
  # Pushing code and cutting an APK are separate decisions — the owner asked
  # to confirm before each build rather than get one on every change. Start
  # a build from the Actions tab ("Run workflow"), or restore the `push:`
  # trigger below if you want an APK on every mobile/ change again:
  #
  #   push:
  #     branches: [claude/voxo-android-whatsapp-txghqq]
  #     paths: ["mobile/**", ".github/workflows/android-build.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    # Safeguard so a genuinely stuck run doesn't tie up a runner until
    # GitHub's own 6-hour default job timeout.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Configure backend URL
        # mobile/src/utils/env.ts deliberately throws at app startup if these
        # aren't set — a misconfigured build should crash loudly instead of
        # silently pointing nowhere — so a build with no .env crashes the
        # instant the app opens, before any screen renders. This step is
        # what was missing. Defaults to the deployed Render backend
        # (DEPLOY.md) for both workflow_dispatch (its own input default) and
        # plain push-triggered runs (github.event.inputs is empty there, so
        # this literal fallback is what actually applies) — override via
        # workflow_dispatch's api_url/socket_url inputs for a local backend
        # on your PC's LAN IP instead.
        env:
          SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ github.event.inputs.api_url || 'https://chatapp-0orj.onrender.com' }}" >> .env
          echo "EXPO_PUBLIC_SOCKET_URL=${{ github.event.inputs.socket_url || 'https://chatapp-0orj.onrender.com' }}" >> .env

          # Crash reporting. Optional in exactly the same way google-services
          # below is: with no secret the SDK never initialises and the app is
          # unchanged. It has to be written HERE rather than read from a
          # local .env, because this step creates the .env the bundler sees —
          # a DSN set only on someone's laptop would never reach the APK, and
          # the build would look fine while reporting nothing.
          #
          # A DSN only grants permission to write events, never to read them,
          # so it is safe baked into the bundle. SENTRY_AUTH_TOKEN is not,
          # and must never be added here.
          if [ -n "$SENTRY_DSN" ]; then
            echo "EXPO_PUBLIC_SENTRY_DSN=$SENTRY_DSN" >> .env
            echo "Sentry DSN written — crash reporting enabled in this build"
          else
            echo "EXPO_PUBLIC_SENTRY_DSN secret not set — building without crash reporting"
          fi

      - name: Write sentry.properties (source-map upload)
        # Optional, exactly like google-services.json below. Without these
        # secrets the file is not written, android/app/build.gradle skips
        # applying sentry.gradle.kts entirely, and the build is byte-for-byte
        # what it was before Sentry existed.
        #
        # Written here rather than committed because auth.token grants READ
        # access to the whole Sentry org — it is the one Sentry credential
        # that is genuinely secret (the DSN only permits writing events).
        # android/.gitignore also refuses it, so a local copy can never be
        # committed by accident.
        #
        # Without this, a release APK's JS stack traces point at minified
        # Hermes bytecode and are close to useless.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'v0x0' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'voxo-mobile' }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            {
              echo "defaults.url=https://sentry.io/"
              echo "defaults.org=$SENTRY_ORG"
              echo "defaults.project=$SENTRY_PROJECT"
              echo "auth.token=$SENTRY_AUTH_TOKEN"
            } > android/sentry.properties
            echo "sentry.properties written — source maps will be uploaded for $SENTRY_ORG/$SENTRY_PROJECT"
          else
            echo "SENTRY_AUTH_TOKEN secret not set — building without source-map upload"
          fi

      - name: Write google-services.json (Firebase / push notifications)
        # Optional. The file identifies one specific Firebase project, so it
        # is not committed — add its contents as the GOOGLE_SERVICES_JSON
        # repository secret to enable push (see PUSH_SETUP.md). Without the
        # secret the build still succeeds and the app still works; push just
        # never registers and messages arrive over Socket.IO only, which is
        # exactly how the app behaved before push existed. Failing the build
        # here would make an optional feature mandatory.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            # android/app/ is where the Gradle plugin reads it. This build
            # runs Gradle directly with no prebuild step, so nothing else
            # would put it there. Written to both paths so the two stay in
            # step whether or not a prebuild is ever added.
            cp google-services.json android/app/google-services.json
            echo "google-services.json written — push notifications enabled in this build"
          else
            echo "GOOGLE_SERVICES_JSON secret not set — building without push notifications"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform/build-tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Assemble release-type APK (debug-signed, JS bundle embedded)
        working-directory: mobile/android
        timeout-minutes: 15
        # Restricts the native (Reanimated/Gesture Handler/app) CMake/ninja
        # build to arm64-v8a only, instead of gradle.properties' default of
        # all 4 ABIs — arm64-v8a alone covers virtually every real Android
        # device, and building 4 architectures roughly quadruples native
        # compile time for no benefit on a smoke/test APK.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxo-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
